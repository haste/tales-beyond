<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Tales Beyond - Options</title>
        <link rel="stylesheet" href="css/bootstrap.css">
        <link rel="stylesheet" href="css/options.css">
        <link rel="shortcut icon" type="image/png" href="icons/icon_48.png">
    </head>
    <body>
        <main>
            <h1>
                <img src="icons/icon_48.png" alt="Tales Beyond">
                Tales Beyond
            </h1>
            <section id="general">
                <h4>General</h4>
                <div id="general-list"></div>
            </section>
            <section id="theme">
                <h4>Theme</h4>
                <div id="theme-list"></div>
            </section>
            <section id="modifiers">
                <h4>Modifier key behavior</h4>
                <div id="key-list"></div>
            </section>
            <section id="actions">
                <h4>Action and Spell modifications</h4>
                <div id="mod-list"></div>
            </section>
            <section id="deactivated-characters">
                <h4>Deactivated characters</h4>
                <p class="none-deactivated">
                    To deactivate Tales Beyond for a character, open its sheet, click the Tales Beyond icon,
                    and select <em>Deactivate for this character</em>.
                </p>
                <div id="deactivated-list"></div>
            </section>
        </main>
        <footer>
            <a href="https://www.dndbeyond.com/sign-in?returnUrl=/characters">Return to D&amp;D Beyond</a>
        </footer>
        <template id="template-dropdown">
            <div class="input-group mb-3 option-dropdown">
                <!-- biome-ignore lint/a11y/noLabelWithoutControl: Set by addDropdown. -->
                <label class="input-group-text"></label>
                <select class="form-select"></select>
            </div>
        </template>
        <template id="template-checkbox">
            <!-- biome-ignore lint/a11y/noLabelWithoutControl: Set by addCheckbox. -->
            <label class="form-control option form-check-label mb-3">
                <div class="description">
                    <header>
                    </header>
                </div>
                <div class="form-switch">
                    <input class="form-check-input" type="checkbox" role="switch" aria-checked="false">
                </div>
            </label>
        </template>
        <template id="template-deactivated-character">
            <div class="input-group mb-3">
                <span class="input-group-text flex-fill"></span>
                <button class="btn" type="button">Activate</button>
            </div>
        </template>
        <template id="template-custom-theme">
            <div class="custom-theme">
                <label class="form-control option form-check-label custom-theme-toggle mb-3">
                    <div class="description">
                        <header>Use custom theme</header>
                        Override the colors picked up from D&amp;D Beyond with your own.
                    </div>
                    <div class="form-switch">
                        <input class="form-check-input custom-theme-enabled" type="checkbox" role="switch" aria-checked="false">
                    </div>
                </label>
                <div class="custom-theme-body">
                    <div class="custom-theme-pickers">
                        <div class="custom-theme-picker" data-field="primaryColor">
                            <label for="custom-theme-primaryColor">Border / accent</label>
                            <div class="custom-theme-picker-inputs">
                                <div class="custom-theme-color"></div>
                                <input id="custom-theme-primaryColor" type="text" class="custom-theme-hex form-control" spellcheck="false" autocomplete="off" maxlength="7" pattern="#[0-9a-fA-F]{6}">
                            </div>
                        </div>
                        <div class="custom-theme-picker" data-field="lightHoverColor">
                            <label for="custom-theme-lightHoverColor">Hover (light pages)</label>
                            <div class="custom-theme-picker-inputs">
                                <div class="custom-theme-color"></div>
                                <input id="custom-theme-lightHoverColor" type="text" class="custom-theme-hex form-control" spellcheck="false" autocomplete="off" maxlength="7" pattern="#[0-9a-fA-F]{6}">
                            </div>
                        </div>
                        <div class="custom-theme-picker" data-field="darkHoverColor">
                            <label for="custom-theme-darkHoverColor">Hover (dark pages)</label>
                            <div class="custom-theme-picker-inputs">
                                <div class="custom-theme-color"></div>
                                <input id="custom-theme-darkHoverColor" type="text" class="custom-theme-hex form-control" spellcheck="false" autocomplete="off" maxlength="7" pattern="#[0-9a-fA-F]{6}">
                            </div>
                        </div>
                    </div>
                    <div class="custom-theme-previews">
                        <div class="custom-theme-preview custom-theme-preview--light">
                            <div class="custom-theme-preview-label">Light page</div>
                            <button type="button" class="custom-theme-preview-button">1d20</button>
                            <button type="button" class="custom-theme-preview-button is-hover">1d20</button>
                        </div>
                        <div class="custom-theme-preview custom-theme-preview--dark">
                            <div class="custom-theme-preview-label">Dark page</div>
                            <button type="button" class="custom-theme-preview-button">1d20</button>
                            <button type="button" class="custom-theme-preview-button is-hover">1d20</button>
                        </div>
                    </div>
                </div>
            </div>
        </template>
        <script src="options.js" type="module"></script>
    </body>
</html>
